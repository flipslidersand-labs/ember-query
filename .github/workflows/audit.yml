name: audit

# 依存の脆弱性(RUSTSEC)を Cargo.lock から検知する(Refs #53)。助言扱い: required check にはしない。
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
  schedule:
    - cron: "17 3 * * 1" # 毎週月曜 03:17 UTC。新規 advisory を拾う

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ${{ vars.GATE_RUNNER }}
    permissions:
      contents: read
      checks: write # audit-check が結果を Check Run として書く
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
